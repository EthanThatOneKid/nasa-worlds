<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NASA Worlds - Historical Artwork Discovery</title>
    <meta name="description" content="A curated, high-fidelity discovery gallery of 50 historical NASA mission artworks representing the retro-futurist aesthetic.">
    
    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="NASA Worlds - Historical Artwork Discovery">
    <meta property="og:description" content="A curated, high-fidelity gallery of historical NASA mission artworks.">
    <meta property="og:image" content="https://github.com/ethanthatonekid/nasa-worlds/raw/main/crop/ARC-1975-AC75-1086.jpg">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;800&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <a href="https://github.com/ethanthatonekid/nasa-worlds" class="github-corner" aria-label="View source on GitHub" target="_blank" rel="noopener">
        <svg width="80" height="80" viewBox="0 0 250 250" style="fill:#3b82f6; color:#0a0a0c; position: absolute; top: 0; border: 0; right: 0;" aria-hidden="true">
            <path d="M0,0 L115,115 L130,115 L142,142 L250,250 L250,0 Z"></path>
            <path d="M128.3,109.0 C113.8,99.7 119.0,89.6 119.0,89.6 C122.0,82.7 120.5,78.6 120.5,78.6 C119.2,72.0 123.4,76.3 123.4,76.3 C127.3,80.9 125.5,87.3 125.5,87.3 C122.9,97.6 130.6,101.9 134.4,103.2" fill="currentColor" style="transform-origin: 130px 106px;" class="octo-arm"></path>
            <path d="M115.0,115.0 C114.9,115.1 118.7,116.5 119.8,115.4 L133.7,101.6 C136.9,99.2 139.9,98.4 142.2,98.6 C133.8,88.0 127.5,74.4 143.8,58.0 C148.5,53.3 154.0,51.2 159.7,51.0 C160.3,49.4 163.2,43.6 171.4,40.1 C171.4,40.1 176.1,42.5 178.8,56.2 C183.1,58.6 187.2,61.8 190.9,65.4 C194.5,69.0 197.7,73.2 200.1,77.6 C213.8,80.2 216.3,84.9 216.3,84.9 C212.7,93.1 206.9,96.0 205.4,96.6 C205.1,102.4 203.0,107.9 198.3,112.5 C181.9,128.9 168.3,122.5 157.7,114.1 C157.9,116.9 156.7,120.9 152.7,124.9 L141.0,136.5 C139.8,137.7 141.6,141.9 141.8,141.8 Z" fill="currentColor" class="octo-body"></path>
        </svg>
    </a>
    <div class="container">
        <header>
            <h1>NASA Worlds</h1>
            <p class="subtitle">Exploring the retro-futurist vision of space colonization and planetary exploration through historical NASA mission art.</p>
        </header>

        <main>
            <section class="search-container">
                <div class="search-controls">
                    <div class="search-input-wrapper">
                        <label for="search-input" class="sr-only">Search mission art by description, artist, or NASA ID</label>
                        <input type="text" id="search-input" class="search-input" placeholder="Search mission art...">
                        <svg class="search-icon" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                        </svg>
                    </div>
                    <div class="view-toggle">
                        <label class="toggle-switch" title="Toggle between cropped and original images" aria-label="Toggle image quality mode">
                            <input type="checkbox" id="view-mode-toggle">
                            <span class="toggle-slider"></span>
                            <span class="toggle-label toggle-crop">Crop</span>
                            <span class="toggle-label toggle-orig">Original</span>
                        </label>
                    </div>
                </div>
                <div id="search-stats" class="search-stats" aria-live="polite">Loading collection...</div>
            </section>

            <div id="artwork-grid" class="artwork-grid">
                <!-- Cards will be injected here -->
            </div>
        </main>
    </div>

    <script type="importmap">
        {
            "imports": {
                "@orama/orama": "https://esm.sh/@orama/orama@latest"
            }
        }
    </script>

    <script type="module">
        import { create, insertMultiple, search } from '@orama/orama'

        let db;
        let allAssets = [];
        let viewMode = 'crop'; // default view mode

        // Simple Intersection Observer to reveal cards
        const observerOptions = {
            threshold: 0.1,
            rootMargin: '0px 0px -50px 0px'
        };

        const observer = new IntersectionObserver((entries) => {
            entries.forEach((entry, index) => {
                if (entry.isIntersecting) {
                    // Slight artificial delay for staggered effect when many appear at once
                    setTimeout(() => {
                        entry.target.classList.add('visible');
                    }, index * 50);
                    observer.unobserve(entry.target);
                }
            });
        }, observerOptions);

        async function initSearch(data) {
            db = await create({
                schema: {
                    nasa_id: 'string',
                    description: 'string',
                    author: 'string',
                }
            });

            await insertMultiple(db, data.map(asset => ({
                nasa_id: asset.nasa_id,
                description: asset.description,
                author: asset.author,
                id: asset.nasa_id 
            })));

            const searchInput = document.getElementById('search-input');
            const searchStats = document.getElementById('search-stats');
            
            searchStats.textContent = `Showing all ${data.length} artworks`;

            searchInput.addEventListener('input', async (e) => {
                const term = e.target.value.trim();
                
                if (!term) {
                    renderGallery(allAssets);
                    searchStats.textContent = `Showing all ${allAssets.length} artworks`;
                    return;
                }

                const results = await search(db, {
                    term: term,
                    properties: ['nasa_id', 'description', 'author'],
                    threshold: 0.2,
                    boost: {
                        nasa_id: 2,
                        description: 1,
                        author: 1
                    }
                });

                const filteredIds = new Set(results.hits.map(hit => hit.document.nasa_id));
                const filteredAssets = allAssets.filter(asset => filteredIds.has(asset.nasa_id));
                
                renderGallery(filteredAssets);
                searchStats.textContent = `Found ${filteredAssets.length} matching artworks`;
            });
        }

        function renderGallery(assets) {
            const grid = document.getElementById('artwork-grid');
            grid.innerHTML = '';

            assets.forEach(asset => {
                const card = document.createElement('article');
                const isCrop = viewMode === 'crop';
                const assetUrl = isCrop ? asset.mirror.crop : asset.mirror.original;
                const assetLabel = isCrop ? "Cropped" : "Original";
                
                card.className = 'artwork-card';
                card.setAttribute('tabindex', '0');
                card.setAttribute('aria-label', `NASA Artwork: ${asset.description}`);
                
                card.innerHTML = `
                    <div class="card-image-wrapper">
                        <img class="card-img" 
                             src="${assetUrl}" 
                             alt="${asset.description}" 
                             loading="lazy">
                    </div>
                    <div class="card-content">
                        <div class="card-header">
                            <h3 class="card-title">${asset.description}</h3>
                        </div>
                        <div class="card-meta">
                            <span class="card-artist">By ${asset.author}</span>
                        </div>
                        <div class="card-footer">
                            <div class="card-actions">
                                <div class="split-btn">
                                    <a href="${assetUrl}" class="btn split-btn-main" target="_blank" rel="noopener">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
                                        Open image
                                    </a>
                                    <div class="split-btn-dropdown-container">
                                        <button type="button" class="btn split-btn-trigger" aria-haspopup="true" aria-expanded="false" title="More options">
                                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
                                        </button>
                                        <div class="split-btn-menu">
                                            <button type="button" class="split-btn-menu-item copy-link-btn" data-url="${new URL(assetUrl, window.location.href).href}">
                                                <div class="split-btn-menu-title">
                                                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>
                                                    <span class="copy-link-text">Copy link</span>
                                                </div>
                                                <div class="split-btn-menu-desc">Copy ${assetLabel.toLowerCase()} URL</div>
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <a href="${asset.url}" class="nasa-id-link" target="_blank" rel="noopener" title="View on NASA.gov">
                                <span class="nasa-id">${asset.nasa_id}</span>
                            </a>
                        </div>
                    </div>
                `;

                card.addEventListener('click', (e) => {
                    if (e.target.closest('a') || e.target.closest('button')) return;
                    window.open(asset.url, '_blank', 'noopener');
                });
                
                card.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') {
                        window.open(asset.url, '_blank', 'noopener');
                    }
                });
                
                grid.appendChild(card);
                observer.observe(card);
            });
        }

        async function loadGallery() {
            try {
                const response = await fetch('data.json');
                allAssets = await response.json();
                
                renderGallery(allAssets);
                await initSearch(allAssets);
                
            } catch (error) {
                console.error('Error loading gallery data:', error);
                document.getElementById('search-stats').textContent = 'Error loading collection';
            }
        }

        // Setup view toggle listener
        document.getElementById('view-mode-toggle').addEventListener('change', (e) => {
            viewMode = e.target.checked ? 'original' : 'crop';
            const searchInput = document.getElementById('search-input');
            searchInput.dispatchEvent(new Event('input'));
        });

        // Setup dropdown split button logic
        document.addEventListener('click', async (e) => {
            const copyBtn = e.target.closest('.copy-link-btn');
            if (copyBtn) {
                e.preventDefault();
                e.stopPropagation();
                try {
                    await navigator.clipboard.writeText(copyBtn.dataset.url);
                    const textEl = copyBtn.querySelector('.copy-link-text');
                    const originalText = textEl.textContent;
                    textEl.textContent = 'Copied!';
                    setTimeout(() => {
                        textEl.textContent = originalText;
                    }, 2000);
                } catch (err) {
                    console.error('Failed to copy', err);
                }
                return;
            }

            const trigger = e.target.closest('.split-btn-trigger');
            
            // Close menus when clicking outside
            if (!trigger && !e.target.closest('.split-btn-menu')) {
                document.querySelectorAll('.split-btn-menu.show').forEach(m => {
                    m.classList.remove('show');
                    m.previousElementSibling.setAttribute('aria-expanded', 'false');
                });
            }
            
            if (trigger) {
                e.preventDefault();
                e.stopPropagation();
                
                const menu = trigger.nextElementSibling;
                const isExpanded = menu.classList.contains('show');
                
                // Close all others
                document.querySelectorAll('.split-btn-menu.show').forEach(m => {
                    if (m !== menu) {
                        m.classList.remove('show');
                        m.previousElementSibling.setAttribute('aria-expanded', 'false');
                    }
                });
                
                if (!isExpanded) {
                    menu.classList.add('show');
                    trigger.setAttribute('aria-expanded', 'true');
                } else {
                    menu.classList.remove('show');
                    trigger.setAttribute('aria-expanded', 'false');
                }
            }
        });

        document.addEventListener('DOMContentLoaded', loadGallery);
    </script>
</body>
</html>
